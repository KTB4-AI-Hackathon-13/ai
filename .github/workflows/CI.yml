name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        # exit code 5 = 수집된 테스트 없음 → 아직 테스트 미작성이라 통과 처리
        run: |
          code=0
          pytest -q || code=$?
          if [ $code -eq 0 ] || [ $code -eq 5 ]; then exit 0; else exit $code; fi

      # Dockerfile 빌드 통과 여부 확인 (push는 안 함)
      - name: Docker build check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
